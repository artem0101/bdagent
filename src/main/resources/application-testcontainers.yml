spring:
  application:
    name: bdagent

  datasource:
    url: jdbc:postgresql://localhost:15432/realtor_agency
    username: username
    password: password

  docker:
    enabled: true
    compose:
      file: ./docker-compose.yml

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.format_sql: true
    show-sql: true

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public

server:
  port: 8181
