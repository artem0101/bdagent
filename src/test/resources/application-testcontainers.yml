spring:
  application:
    name: bdagent

  datasource:
    url: jdbc:tc:postgresql:14://realtor_agency

  sql:
    init:
      mode: always
      schema-location: classpath:schema.sql

  docker:
    enabled: true
    compose:
      file: ./docker-compose.yml

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.format_sql: true
      default_schema: realtor_agency
    show-sql: true

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 8181
